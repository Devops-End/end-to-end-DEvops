apiVersion: v1
kind: Pod
metadata:
  name: test-pod
  namespace: flask
  labels:
    app: test-pod

spec:
  containers:
    - name: test-container
      image: nginx:alpine
      ports: 80
      
      resources:
        requests:
          cpu: "50m"
          memory: "64mi"
        limits:
          cpu: "200m"
          memory: "128mi"